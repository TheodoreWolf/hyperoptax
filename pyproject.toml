[project]
name = "hyperoptax"
version = "0.2.0"
description = "Tuning hyperparameters with JAX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.38", "optax", "jaxtyping"]
license = "Apache-2.0"
authors = [{name = "Theo Wolf"}]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.116",
    "scikit-learn>=1.5",
    "uvicorn>=0.35",
]
notebooks = [
    "flax",
    "jupyter",
    "matplotlib",
    "notebook",
    "rejax>=0.1.2",
    "tqdm",
    "bayesian-optimization",
    "bayex"
]
# Testing
testing = [
    "httpx>=0.28",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1"
]

# Development tools (linting, formatting, etc.)
dev = [
    "ruff",
    "mypy",
    "pre-commit"
]

# Complete development environment
all = [
    "hyperoptax[notebooks,testing,dev,docs]"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hyperoptax*"]

[tool.setuptools.package-data]
"hyperoptax.dashboard" = ["static/*"]

[project.scripts]
hyperoptax = "hyperoptax.dashboard.cli:main"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[dependency-groups]
docs = [
    "sphinx>=6.1",
    "sphinx-book-theme>=1.1.4",
    "sphinx-autobuild"
]

[tool.pytest.ini_options]
markers = [
    "timing: performance/throughput benchmarks (deselect with '-m not timing')",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N803", "N806"]  # Allow uppercase variable names

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
